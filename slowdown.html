<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Keep Scrolling (slowdown)</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0c0c0c; overscroll-behavior: none; }
      #feed {
        position: absolute;
        overflow-y: scroll;
        scroll-snap-type: y mandatory;
        overscroll-behavior: contain;
        scrollbar-width: none;
        background: #000;
        -webkit-tap-highlight-color: transparent;
      }
      #feed::-webkit-scrollbar { display: none; }
      .card { height: 100%; scroll-snap-align: start; scroll-snap-stop: always; }
      #feed > canvas { position: absolute; top: 0; left: 0; width: 100%; pointer-events: none; }
      #progress { position: absolute; height: 3px; background: rgba(255, 255, 255, 0.25); pointer-events: none; }
      #progress div { height: 100%; background: #fff; transform-origin: left; transform: scaleX(0); }
      [hidden] { display: none !important; }
      #hint {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 32px;
        text-align: center;
        color: rgba(255, 255, 255, 0.8);
        font: 16px "Helvetica Neue", Helvetica, Arial, sans-serif;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="feed"></div>
    <div id="progress"><div></div></div>
    <div id="hint">Loading…</div>
    <script src="https://cdn.jsdelivr.net/npm/mp4box@0.5.2/dist/mp4box.all.min.js"></script>
    <script src="slowdown.js"></script>
  </body>
</html>
